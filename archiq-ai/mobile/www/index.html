<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiq AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 20px; text-align: center; border-bottom: 1px solid #333; }
        .header h1 { color: #4fc3f7; font-size: 1.8em; }
        .header p { color: #888; margin-top: 5px; }
        .nav { display: flex; background: #1a1a2e; border-bottom: 1px solid #333; overflow-x: auto; }
        .nav-btn { flex: 1; padding: 12px 8px; text-align: center; color: #888; cursor: pointer; font-size: 13px; border: none; background: none; white-space: nowrap; }
        .nav-btn.active { color: #4fc3f7; border-bottom: 2px solid #4fc3f7; }
        .content { padding: 16px; max-width: 600px; margin: 0 auto; }
        .panel { display: none; }
        .panel.active { display: block; }
        .card { background: #1a1a2e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        .card h3 { color: #4fc3f7; margin-bottom: 12px; }
        input[type="text"], textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0f; color: #e0e0e0; font-size: 14px; margin-bottom: 10px; }
        textarea { min-height: 80px; resize: vertical; }
        button { background: #4fc3f7; color: #0a0a0f; border: none; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
        button:active { opacity: 0.8; }
        button:disabled { opacity: 0.5; cursor: wait; }
        .result { background: #0a0a0f; border-radius: 8px; padding: 12px; margin-top: 12px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; border: 1px solid #222; }
        .norm-item { padding: 10px; border-bottom: 1px solid #222; }
        .norm-item:last-child { border: none; }
        .norm-item strong { color: #4fc3f7; }
        .status { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .status-tag { padding: 4px 10px; border-radius: 20px; font-size: 12px; }
        .status-ok { background: #1b5e20; color: #81c784; }
        .status-off { background: #b71c1c; color: #ef9a9a; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0a0a0f; color: #e0e0e0; font-size: 14px; margin-bottom: 10px; }
        .loading { text-align: center; padding: 20px; color: #4fc3f7; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏗️ Archiq AI</h1>
        <p>Строительные нормы Казахстана</p>
    </div>
    <div class="nav">
        <button class="nav-btn active" onclick="showTab('ask')">💬 Вопрос</button>
        <button class="nav-btn" onclick="showTab('norms')">📚 Нормы</button>
        <button class="nav-btn" onclick="showTab('ocr')">📷 OCR</button>
        <button class="nav-btn" onclick="showTab('viz')">🎨 Визуал</button>
    </div>
    <div class="content">
        <div id="status-bar" class="status"></div>
        
        <div id="ask" class="panel active">
            <div class="card">
                <h3>💬 Спросить AI</h3>
                <textarea id="ask-question" placeholder="Например: какая минимальная ширина лестницы?"></textarea>
                <label><input type="checkbox" id="use-norms" checked> Использовать базу норм</label><br><br>
                <button onclick="askAI()" id="ask-btn">Отправить</button>
                <div id="ask-result"></div>
            </div>
        </div>
        
        <div id="norms" class="panel">
            <div class="card">
                <h3>📚 Поиск норм</h3>
                <input type="text" id="norms-search" placeholder="Поиск: лестница, пожар, фундамент...">
                <button onclick="searchNorms()" id="norms-btn">Найти</button>
                <div id="norms-result"></div>
            </div>
        </div>
        
        <div id="ocr" class="panel">
            <div class="card">
                <h3>📷 Распознать текст</h3>
                <input type="file" id="ocr-file" accept="image/*">
                <button onclick="doOCR()" id="ocr-btn" style="margin-top:10px">Распознать</button>
                <div id="ocr-result"></div>
            </div>
        </div>
        
        <div id="viz" class="panel">
            <div class="card">
                <h3>🎨 Генерация визуализации</h3>
                <input type="text" id="viz-prompt" placeholder="Опишите: двухэтажный дом в стиле хай-тек...">
                <select id="viz-style">
                    <option value="photorealistic">Фотореализм</option>
                    <option value="watercolor">Акварель</option>
                    <option value="sketch">Эскиз</option>
                    <option value="minimalism">Минимализм</option>
                    <option value="high-tech">Хай-тек</option>
                    <option value="industrial">Индустриал</option>
                    <option value="neoclassic">Неоклассика</option>
                    <option value="scandinavian">Скандинавский</option>
                </select>
                <button onclick="generateViz()" id="viz-btn">Генерировать</button>
                <div id="viz-result"></div>
            </div>
        </div>
    </div>

    <script>
        const API = "https://archiq-ai-api.onrender.com";
        
        function showTab(id) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
        }
        
        function setStatus(data) {
            const bar = document.getElementById('status-bar');
            const tags = [
                { ok: data.gemini_configured, text: 'Gemini AI' },
                { ok: data.hf_configured, text: 'HuggingFace OCR' },
                { ok: data.sdsd_available, text: 'Stable Diffusion' }
            ];
            bar.innerHTML = tags.map(t => 
                '<span class="status-tag ' + (t.ok ? 'status-ok' : 'status-off') + '">' + 
                (t.ok ? '✅' : '❌') + ' ' + t.text + '</span>'
            ).join('');
        }
        
        async function askAI() {
            const btn = document.getElementById('ask-btn');
            const result = document.getElementById('ask-result');
            btn.disabled = true;
            btn.textContent = 'Загрузка...';
            result.innerHTML = '<div class="loading">Думаю...</div>';
            try {
                const r = await fetch(API + '/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: document.getElementById('ask-question').value,
                        use_norms: document.getElementById('use-norms').checked
                    })
                });
                const d = await r.json();
                result.innerHTML = '<div class="result">' + (d.answer || JSON.stringify(d)) + '</div>';
            } catch(e) {
                result.innerHTML = '<div class="result" style="color:#ef5350">Ошибка: ' + e.message + '</div>';
            }
            btn.disabled = false;
            btn.textContent = 'Отправить';
        }
        
        async function searchNorms() {
            const btn = document.getElementById('norms-btn');
            const result = document.getElementById('norms-result');
            btn.disabled = true;
            btn.textContent = 'Поиск...';
            result.innerHTML = '<div class="loading">Ищу...</div>';
            try {
                const q = document.getElementById('norms-search').value;
                const r = await fetch(API + '/norms?search=' + encodeURIComponent(q));
                const d = await r.json();
                if (d.length === 0) {
                    result.innerHTML = '<div class="result">Ничего не найдено</div>';
                } else {
                    result.innerHTML = '<div class="result">' + d.map(n => 
                        '<div class="norm-item"><strong>' + (n.code||'') + '</strong><br>' + (n.title||'') + '<br><small>' + (n.content||'').substring(0,200) + '</small></div>'
                    ).join('') + '</div>';
                }
            } catch(e) {
                result.innerHTML = '<div class="result" style="color:#ef5350">Ошибка: ' + e.message + '</div>';
            }
            btn.disabled = false;
            btn.textContent = 'Найти';
        }
        
        async function doOCR() {
            const btn = document.getElementById('ocr-btn');
            const result = document.getElementById('ocr-result');
            const file = document.getElementById('ocr-file').files[0];
            if (!file) { result.innerHTML = '<div class="result" style="color:#ef5350">Выберите файл</div>'; return; }
            btn.disabled = true;
            btn.textContent = 'Загрузка...';
            result.innerHTML = '<div class="loading">Распознаю...</div>';
            try {
                const fd = new FormData();
                fd.append('file', file);
                const r = await fetch(API + '/ocr', { method: 'POST', body: fd });
                const d = await r.json();
                result.innerHTML = '<div class="result">' + (d.text || JSON.stringify(d)) + '</div>';
            } catch(e) {
                result.innerHTML = '<div class="result" style="color:#ef5350">Ошибка: ' + e.message + '</div>';
            }
            btn.disabled = false;
            btn.textContent = 'Распознать';
        }
        
        async function generateViz() {
            const btn = document.getElementById('viz-btn');
            const result = document.getElementById('viz-result');
            btn.disabled = true;
            btn.textContent = 'Генерация...';
            result.innerHTML = '<div class="loading">Генерирую...</div>';
            try {
                const r = await fetch(API + '/generate-visualization', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: document.getElementById('viz-prompt').value,
                        style: document.getElementById('viz-style').value
                    })
                });
                const d = await r.json();
                let html = '<div class="result">';
                if (d.image_url) html += '<img src="' + d.image_url + '" style="max-width:100%">';
                if (d.description) html += '<p>' + d.description + '</p>';
                html += '<p>Метод: ' + (d.method || 'N/A') + '</p></div>';
                result.innerHTML = html;
            } catch(e) {
                result.innerHTML = '<div class="result" style="color:#ef5350">Ошибка: ' + e.message + '</div>';
            }
            btn.disabled = false;
            btn.textContent = 'Генерировать';
        }
        
        // Load status
        fetch(API + '/health').then(r => r.json()).then(setStatus);
    </script>
</body>
</html>
