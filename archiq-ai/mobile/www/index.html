<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Archiq AI — Генератор планов</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        
        /* Header */
        .header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 16px; text-align: center; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 20px; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: #64748b; font-size: 12px; margin-top: 2px; }
        
        /* Steps indicator */
        .steps { display: flex; background: #1e293b; border-bottom: 1px solid #334155; overflow-x: auto; }
        .step { flex: 1; min-width: 80px; padding: 10px 8px; text-align: center; font-size: 12px; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; }
        .step.active { color: #38bdf8; border-bottom-color: #38bdf8; }
        .step.done { color: #22c55e; }
        .step-num { font-size: 16px; display: block; margin-bottom: 2px; }
        
        /* Content */
        .content { padding: 16px; padding-bottom: 80px; }
        .step-content { display: none; }
        .step-content.active { display: block; }
        
        /* Cards */
        .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; }
        .card h3 { font-size: 15px; color: #f8fafc; margin-bottom: 12px; }
        
        /* Form elements */
        label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 4px; margin-top: 10px; }
        label:first-child { margin-top: 0; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: #e2e8f0; font-size: 14px; }
        textarea { min-height: 80px; resize: vertical; }
        input[type="file"] { width: 100%; padding: 10px; background: #0f172a; border: 1px dashed #334155; border-radius: 8px; color: #94a3b8; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #38bdf8; }
        
        /* Row layout */
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        
        /* Buttons */
        .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0f172a; margin-top: 16px; }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-secondary { background: #334155; color: #e2e8f0; margin-top: 8px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Plans display */
        .plans-container { display: flex; flex-direction: column; gap: 16px; }
        .plan-card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
        .plan-card h3 { padding: 12px 16px; font-size: 14px; color: #38bdf8; border-bottom: 1px solid #334155; }
        .plan-card svg { width: 100%; height: auto; background: #0f172a; }
        
        /* Specs */
        .specs-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .spec-item { background: #0f172a; border-radius: 8px; padding: 12px; }
        .spec-item .label { color: #64748b; font-size: 11px; }
        .spec-item .value { color: #e2e8f0; font-size: 16px; font-weight: 600; margin-top: 2px; }
        
        /* Loading */
        .loading { text-align: center; padding: 40px 20px; }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: #64748b; margin-top: 12px; }
        
        /* Error */
        .error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; padding: 12px; color: #ef4444; margin-top: 12px; }
        
        /* Toast */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #334155; color: #e2e8f0; padding: 10px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; }
        .toast.show { opacity: 1; }
        
        /* Compliance list */
        .compliance { margin-top: 12px; }
        .compliance li { color: #22c55e; font-size: 13px; padding: 4px 0; padding-left: 8px; border-left: 2px solid #22c55e; margin-bottom: 6px; }
        
        /* Project history */
        .project-item { background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .project-item .name { font-weight: 600; color: #e2e8f0; }
        .project-item .meta { color: #64748b; font-size: 12px; }
        .project-item button { background: #38bdf8; color: #0f172a; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏗️ Archiq AI</h1>
        <p>Генератор архитектурных планов</p>
    </div>
    
    <div class="steps">
        <div class="step active" data-step="1"><span class="step-num">1</span>Проект</div>
        <div class="step" data-step="2"><span class="step-num">2</span>Участок</div>
        <div class="step" data-step="3"><span class="step-num">3</span>Результат</div>
    </div>
    
    <div class="content">
        <!-- STEP 1: Project parameters -->
        <div class="step-content active" id="step-1">
            <div class="card">
                <h3>📐 Параметры проекта</h3>
                <label>Название проекта</label>
                <input type="text" id="proj-name" value="Мой дом" placeholder="Название">
                
                <label>Тип здания</label>
                <select id="proj-type">
                    <option value="жилой дом">Жилой дом</option>
                    <option value="дача">Дача</option>
                    <option value="гараж">Гараж</option>
                    <option value="баня">Баня</option>
                    <option value="магазин">Магазин</option>
                    <option value="офис">Офис</option>
                    <option value="склад">Склад</option>
                </select>
                
                <div class="row">
                    <div>
                        <label>Площадь, м²</label>
                        <input type="number" id="proj-area" value="100" min="20" max="500">
                    </div>
                    <div>
                        <label>Этажей</label>
                        <select id="proj-floors">
                            <option value="1">1 этаж</option>
                            <option value="2">2 этажа</option>
                            <option value="3">3 этажа</option>
                        </select>
                    </div>
                </div>
                
                <label>Количество комнат</label>
                <input type="number" id="proj-rooms" value="3" min="1" max="10">
                
                <label>Дополнительные требования</label>
                <textarea id="proj-req" placeholder="Например: большая гостиная, два санузла, гараж на 2 машины, терраса..."></textarea>
                
                <button class="btn btn-primary" onclick="goStep(2)">Далее →</button>
            </div>
        </div>
        
        <!-- STEP 2: Site plan -->
        <div class="step-content" id="step-2">
            <div class="card">
                <h3>📍 План участка</h3>
                <div class="row">
                    <div>
                        <label>Ширина участка, м</label>
                        <input type="number" id="site-w" value="20" min="5" max="100">
                    </div>
                    <div>
                        <label>Глубина участка, м</label>
                        <input type="number" id="site-d" value="30" min="5" max="100">
                    </div>
                </div>
                
                <label style="margin-top:16px">Или загрузите план участка (фото/скан)</label>
                <input type="file" id="site-file" accept="image/*">
                <p style="color:#64748b;font-size:11px;margin-top:6px;">AI проанализирует план и извлечёт размеры</p>
                
                <button class="btn btn-primary" id="generate-btn" onclick="generate()">🏗️ Сгенерировать план</button>
                <div id="site-error"></div>
            </div>
            
            <div id="site-analysis-result"></div>
        </div>
        
        <!-- STEP 3: Results -->
        <div class="step-content" id="step-3">
            <div id="loading-view" class="loading" style="display:none;">
                <div class="spinner"></div>
                <p>Генерирую архитектурный план...</p>
                <p style="font-size:12px;color:#475569;">Это может занять до минуты</p>
            </div>
            
            <div id="result-view" style="display:none;">
                <div class="card">
                    <h3>📋 Спецификация проекта</h3>
                    <div class="specs-grid" id="specs-grid"></div>
                    <div class="compliance" id="compliance-list"></div>
                    <p id="proj-desc" style="color:#94a3b8;font-size:13px;margin-top:12px;"></p>
                </div>
                
                <div class="plans-container">
                    <div class="plan-card">
                        <h3>📍 План участка</h3>
                        <div id="site-plan-view"></div>
                    </div>
                    <div class="plan-card">
                        <h3>📐 Поэтажный план</h3>
                        <div id="floor-plan-view"></div>
                    </div>
                </div>
                
                <button class="btn btn-secondary" onclick="goStep(1)">← Новый проект</button>
            </div>
            
            <div id="error-view" class="error" style="display:none;"></div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
        const API = "https://archiq-ai-api.onrender.com";
        let currentProjectId = null;
        
        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        
        function goStep(n) {
            document.querySelectorAll('.step').forEach(s => {
                const sn = parseInt(s.dataset.step);
                s.classList.remove('active', 'done');
                if (sn < n) s.classList.add('done');
                if (sn === n) s.classList.add('active');
            });
            document.querySelectorAll('.step-content').forEach(c => c.classList.remove('active'));
            document.getElementById('step-' + n).classList.add('active');
        }
        
        async function generate() {
            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            btn.textContent = '⏳ Генерация...';
            
            goStep(3);
            document.getElementById('loading-view').style.display = 'block';
            document.getElementById('result-view').style.display = 'none';
            document.getElementById('error-view').style.display = 'none';
            
            const fd = new FormData();
            fd.append('name', document.getElementById('proj-name').value);
            fd.append('building_type', document.getElementById('proj-type').value);
            fd.append('area', document.getElementById('proj-area').value);
            fd.append('floors', document.getElementById('proj-floors').value);
            fd.append('rooms', document.getElementById('proj-rooms').value);
            fd.append('site_width', document.getElementById('site-w').value);
            fd.append('site_depth', document.getElementById('site-d').value);
            fd.append('requirements', document.getElementById('proj-req').value);
            
            const file = document.getElementById('site-file').files[0];
            if (file) fd.append('site_plan', file);
            
            try {
                const res = await fetch(API + '/generate-plan', { method: 'POST', body: fd });
                
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || JSON.stringify(err));
                }
                
                const data = await res.json();
                currentProjectId = data.project_id;
                
                // Load specs
                const specs = data.specs;
                document.getElementById('specs-grid').innerHTML = `
                    <div class="spec-item"><div class="label">Общая площадь</div><div class="value">${specs.total_area} м²</div></div>
                    <div class="spec-item"><div class="label">Жилая площадь</div><div class="value">${specs.living_area} м²</div></div>
                    <div class="spec-item"><div class="label">Этажей</div><div class="value">${specs.floors}</div></div>
                    <div class="spec-item"><div class="label">Комнат</div><div class="value">${specs.rooms_count}</div></div>
                    <div class="spec-item"><div class="label">Размеры здания</div><div class="value">${specs.building_dimensions}</div></div>
                    <div class="spec-item"><div class="label">Размеры участка</div><div class="value">${specs.site_dimensions}</div></div>
                    <div class="spec-item"><div class="label">Площадь застройки</div><div class="value">${specs.building_footprint} м²</div></div>
                    <div class="spec-item"><div class="label">Коэф. застройки</div><div class="value">${specs.site_coverage}%</div></div>
                `;
                
                document.getElementById('proj-desc').textContent = specs.description;
                
                // Compliance
                const compliance = specs.compliance || [];
                document.getElementById('compliance-list').innerHTML = compliance.length ? 
                    '<h4 style="color:#22c55e;margin-bottom:8px;">✅ Соответствие СНиП:</h4>' + 
                    compliance.map(c => '<li>' + c + '</li>').join('') : '';
                
                // Load SVGs
                const siteRes = await fetch(API + '/site-plan-svg?project_id=' + data.project_id);
                document.getElementById('site-plan-view').innerHTML = await siteRes.text();
                
                const floorRes = await fetch(API + '/floor-plan-svg?project_id=' + data.project_id);
                document.getElementById('floor-plan-view').innerHTML = await floorRes.text();
                
                document.getElementById('loading-view').style.display = 'none';
                document.getElementById('result-view').style.display = 'block';
                toast('✅ План сгенерирован!');
                
            } catch (e) {
                document.getElementById('loading-view').style.display = 'none';
                document.getElementById('error-view').style.display = 'block';
                document.getElementById('error-view').textContent = '❌ Ошибка: ' + e.message;
            }
            
            btn.disabled = false;
            btn.textContent = '🏗️ Сгенерировать план';
        }
        
        // Check health on load
        fetch(API + '/health').catch(() => toast('⚠️ Сервер не доступен'));
    </script>
</body>
</html>
